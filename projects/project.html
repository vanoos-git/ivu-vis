<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181916">
  <title>Визуализация проекта</title>
  <link rel="stylesheet" href="../gallery.css?v=4">
  <link rel="stylesheet" href="project.css?v=7">
  <script src="project.js?v=10" defer></script>
  <noscript>
    <style>
      .project-heading[data-awaiting-title] { display: block; }
      #project-status[data-loading] { display: none; }
    </style>
  </noscript>
</head>
<body>
  <main class="project">
    <header class="project-heading" data-awaiting-title>
      <p class="project-type" id="project-subtitle" hidden></p>
      <h1 id="project-title">Визуализация проекта</h1>
    </header>

    <p class="project-status" id="project-status" role="status" data-loading>Загружаем изображения…</p>
    <section class="mosaic project-mosaic" id="project-mosaic" aria-label="Визуализации проекта" hidden></section>
    <noscript><p class="project-status">Включите JavaScript, чтобы открыть визуализации.</p></noscript>
  </main>

  <dialog class="viewer" aria-label="Просмотр визуализаций" aria-describedby="viewer-hint">
    <figure class="viewer-stage" tabindex="-1" autofocus>
      <img class="viewer-image" alt="" draggable="false">
      <figcaption class="viewer-hint" id="viewer-hint">Потяните в сторону, чтобы листать. Вниз — закрыть.</figcaption>
    </figure>
    <span class="sr-only viewer-announcement" aria-live="polite"></span>
  </dialog>
</body>
</html>
