<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181916">
  <meta name="description" content="Галерея архитектурных проектов и визуализаций.">
  <title>Публикация работы</title>
  <link rel="stylesheet" href="gallery.css">
  <link rel="stylesheet" href="projects/catalog.css">
  <script src="projects/catalog.js?v=3" defer></script>
</head>
<body>
  <main class="project">
    <header class="project-heading">
      <p class="project-type">Публикация работы</p>
      <h1>Проекты</h1>
    </header>

    <section class="catalog" aria-label="Выбор проекта">
      <p class="catalog-status" id="catalog-status" role="status">Загружаем проекты…</p>
      <ul class="catalog-list" id="catalog-list"></ul>
      <noscript><p class="catalog-status">Включите JavaScript, чтобы открыть список проектов.</p></noscript>
    </section>
  </main>

  <template id="project-card">
    <li>
      <a class="project-link">
        <span class="project-icon" aria-hidden="true">
          <span class="house"><span class="house-window"></span></span>
        </span>
        <span class="project-copy">
          <span class="project-name"></span>
          <span class="project-subtitle"></span>
        </span>
      </a>
    </li>
  </template>
</body>
</html>
